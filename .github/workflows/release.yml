name: Zimbra Linux amd64 release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-zimbra.*'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake pkg-config
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
      - name: Test
        run: cargo test --locked --lib --tests
      - name: Build static Linux amd64 binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Package and smoke test
        run: |
          mkdir -p package
          cp target/x86_64-unknown-linux-musl/release/vandelay package/
          cp ZIMBRA.md package/
          cp -r LICENSES package/
          package/vandelay --version
          package/vandelay import imap --help | grep -- --auth-proxy-user
          package/vandelay import caldav --help | grep -- --auth-cookie
          git rev-parse HEAD > package/COMMIT.txt
          tar -czf vandelay-linux-amd64.tar.gz -C package .
          sha256sum vandelay-linux-amd64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: vandelay-linux-amd64
          path: |
            vandelay-linux-amd64.tar.gz
            SHA256SUMS
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" vandelay-linux-amd64.tar.gz SHA256SUMS --title "Vandelay $GITHUB_REF_NAME — Zimbra / Linux amd64" --notes-file ZIMBRA.md
